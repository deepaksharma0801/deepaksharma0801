<text class="t" x="450.0" y="25.5" text-anchor="middle" style="fill:#6e7781;font-size:13px">model_card.yaml — deepaksharma0801</text>
<text class="t line" x="32" y="76" style="animation-delay:0.00s"><tspan class="dim"># MODEL CARD</tspan><tspan class="dim">  ·  last updated Oct 2026</tspan></text>
<text class="t line" x="32" y="122" style="animation-delay:0.18s"><tspan class="key">model:          </tspan><tspan class="value">sai-deepak-sharma</tspan><tspan class="dim">  v26.10 (stable, mostly)</tspan></text>
<text class="t line" x="32" y="145" style="animation-delay:0.27s"><tspan class="key">architecture:   </tspan><tspan class="text">human · coffee-cooled · 1 brain, ~∞ browser tabs</tspan></text>
<text class="t line" x="32" y="168" style="animation-delay:0.36s"><tspan class="key">pretraining:    </tspan><tspan class="text">MS Data Science @ Arizona State University </tspan><tspan class="dim">(3.8 GPA)</tspan></text>
<text class="t line" x="32" y="191" style="animation-delay:0.45s"><tspan class="key">fine-tuned on:  </tspan><tspan class="text">agentic workflows @ </tspan><tspan class="value">Echelix</tspan></text>
<text class="t line" x="32" y="214" style="animation-delay:0.54s"><tspan class="key">deployed in:    </tspan><tspan class="text">Phoenix, AZ </tspan><tspan class="dim">(thermal throttling Jun–Sep)</tspan></text>
<text class="t line" x="32" y="237" style="animation-delay:0.63s"><tspan class="key">specialties:    </tspan><tspan class="text">agents · GenAI · ML pipelines · dashboards people open at 8 AM</tspan></text>
<text class="t line" x="32" y="283" style="animation-delay:0.81s"><tspan class="key">eval results:</tspan></text>
<text class="t line" x="32" y="306" style="animation-delay:0.90s"><tspan class="text">  manual effort   </tspan><tspan class="good">▼ 40%      </tspan><tspan class="dim">workflow automation @ ASU Knowledge Enterprise</tspan></text>
<text class="t line" x="32" y="329" style="animation-delay:0.99s"><tspan class="text">  intent accuracy </tspan><tspan class="good">▲ 89%      </tspan><tspan class="dim">enterprise intent recognition</tspan></text>
<text class="t line" x="32" y="352" style="animation-delay:1.08s"><tspan class="text">  throughput      </tspan><tspan class="good">100K+/mo   </tspan><tspan class="dim">records through the ML pipeline</tspan></text>
<text class="t line" x="32" y="398" style="animation-delay:1.26s"><tspan class="key">known limitations:</tspan></text>
<text class="t line" x="32" y="421" style="animation-delay:1.35s"><tspan class="text">  - asks &quot;but did the model actually help?&quot; in every meeting</tspan></text>
<text class="t line" x="32" y="444" style="animation-delay:1.44s"><tspan class="text">  - fails loudly, never silently </tspan><tspan class="dim">(by design)</tspan></text>
<text class="t line" x="32" y="467" style="animation-delay:1.53s"><tspan class="text">  - refuses to call a Jupyter notebook a product</tspan></text>
<text class="t line" x="32" y="513" style="animation-delay:1.71s"><tspan class="accent">$ </tspan><tspan class="text">deepak --hire</tspan></text>
