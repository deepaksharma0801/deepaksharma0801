<svg xmlns="http://www.w3.org/2000/svg" width="900" height="556" viewBox="0 0 900 556">
<style>
text, tspan { white-space: pre; }
.t { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; fill: #1f2328; }
.key { fill: #953800; } .value { fill: #0a3069; } .dim { fill: #6e7781; }
.good { fill: #1a7f37; font-weight: 600; } .accent { fill: #8250df; font-weight: 600; } .text { fill: #1f2328; }
.line { animation: in .45s ease-out backwards; }
.cursor { fill: #8250df; animation: blink 1.1s steps(1) infinite; }
@keyframes in { from { opacity: 0; transform: translateX(-6px); } }
