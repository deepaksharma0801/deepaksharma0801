<svg xmlns="http://www.w3.org/2000/svg" width="900" height="952" viewBox="0 0 900 952">
<style>
text, tspan { white-space: pre; }
.t { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; fill: #c9d1d9; }
.key { fill: #ffa657; } .value { fill: #a5d6ff; } .dim { fill: #8b949e; }
.good { fill: #3fb950; font-weight: 600; } .accent { fill: #d2a8ff; font-weight: 600; } .text { fill: #c9d1d9; }
.cursor { fill: #d2a8ff; animation: blink 1.1s steps(1) infinite; }
.live { fill: #3fb950; animation: live 1.8s ease-out infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes live { 0% { opacity: 1; } 70%, 100% { opacity: .25; } }
</style>
<rect x="0.5" y="0.5" width="899" height="951" rx="14" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 14.5 a14 14 0 0 1 14 -14 h871 a14 14 0 0 1 14 14 v26 h-899 z" fill="#161b22"/>
<line x1="0.5" y1="40.5" x2="899.5" y2="40.5" stroke="#30363d"/>
<circle cx="24" cy="20.5" r="6" fill="#ff5f56"/>
<circle cx="44" cy="20.5" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="20.5" r="6" fill="#27c93f"/>
<text class="t" x="450.0" y="25.5" text-anchor="middle" style="fill:#8b949e;font-size:13px">deepak@production: ~</text>
<text class="t" x="32" y="76"><tspan class="accent">$ </tspan><tspan class="text">whoami</tspan></text>
<text class="t" x="32" y="99"><tspan class="text">I&#x27;m Deepak, an Associate AI Developer at Echelix.</tspan></text>
<text class="t" x="32" y="145"><tspan class="text">I will get this straight. I like a tough challenge and I don&#x27;t like to not know the answers.</tspan></text>
<text class="t" x="32" y="191"><tspan class="text">I build agentic systems that take messy, multi-step enterprise work off people&#x27;s plates, and</tspan></text>
<text class="t" x="32" y="214"><tspan class="text">keep doing it long after the demo applause fades.</tspan></text>
<text class="t" x="32" y="260"><tspan class="text">Most AI dies somewhere between the notebook and the real world. That gap is my favourite</tspan></text>
<text class="t" x="32" y="283"><tspan class="text">place to work: messy data, weird edge cases, real users, and the 8 AM dashboard someone</tspan></text>
<text class="t" x="32" y="306"><tspan class="text">actually opens, an agent which actually works for real users.</tspan></text>
<text class="t" x="32" y="352"><tspan class="text">Real problems, real impact.</tspan></text>
<text class="t" x="32" y="398"><tspan class="accent">$ </tspan><tspan class="text">cat model_card.yaml</tspan></text>
<text class="t" x="32" y="421"><tspan class="dim"># MODEL CARD</tspan><tspan class="dim">  ·  last updated Oct 2026</tspan></text>
<text class="t" x="32" y="467"><tspan class="key">model:          </tspan><tspan class="value">sai-deepak-sharma</tspan><tspan class="dim">  v26.10 (stable, mostly)</tspan></text>
<text class="t" x="32" y="490"><tspan class="key">architecture:   </tspan><tspan class="text">human · coffee-cooled · 1 brain, ~∞ browser tabs</tspan></text>
<text class="t" x="32" y="513"><tspan class="key">pretraining:    </tspan><tspan class="text">MS Data Science @ Arizona State University </tspan><tspan class="dim">(3.8 GPA)</tspan></text>
<text class="t" x="32" y="536"><tspan class="key">fine-tuned on:  </tspan><tspan class="text">agentic workflows @ </tspan><tspan class="value">Echelix</tspan></text>
<text class="t" x="32" y="559"><tspan class="key">deployed in:    </tspan><tspan class="text">Phoenix, AZ </tspan><tspan class="dim">(thermal throttling Jun–Sep)</tspan></text>
<text class="t" x="32" y="582"><tspan class="key">specialties:    </tspan><tspan class="text">agents · GenAI · ML pipelines · dashboards people open at 8 AM</tspan></text>
<text class="t" x="32" y="628"><tspan class="key">eval results:</tspan></text>
<text class="t" x="32" y="651">  manual effort</text>
<rect x="195" y="641" width="110" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
<rect x="195" y="641" width="44" height="8" rx="4" fill="#3fb950"><animate attributeName="width" values="0;0;44" keyTimes="0;0.125;1" dur="1.60s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text class="t good" x="317" y="651">-40%</text>
<text class="t dim" x="407" y="651">workflow automation @ ASU Knowledge Enterprise</text>
<text class="t" x="32" y="674">  intent accuracy</text>
<rect x="195" y="664" width="110" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
<rect x="195" y="664" width="98" height="8" rx="4" fill="#3fb950"><animate attributeName="width" values="0;0;98" keyTimes="0;0.200;1" dur="1.75s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text class="t good" x="317" y="674">89%</text>
<text class="t dim" x="407" y="674">enterprise intent recognition</text>
<text class="t" x="32" y="697">  throughput</text>
<rect x="195" y="687" width="110" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
<rect x="195" y="687" width="110" height="8" rx="4" fill="#3fb950"><animate attributeName="width" values="0;0;110" keyTimes="0;0.263;1" dur="1.90s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text class="t good" x="317" y="697">100K+/mo</text>
<text class="t dim" x="407" y="697">records through the ML pipeline</text>
<text class="t" x="32" y="743"><tspan class="key">known limitations:</tspan></text>
<text class="t" x="32" y="766"><tspan class="text">  - asks &quot;but did the model actually help?&quot; in every meeting</tspan></text>
<text class="t" x="32" y="789"><tspan class="text">  - fails loudly, never silently </tspan><tspan class="dim">(by design)</tspan></text>
<text class="t" x="32" y="812"><tspan class="text">  - refuses to call a Jupyter notebook a product</tspan></text>
<text class="t" x="32" y="858"><tspan class="dim"># &quot;My model is ready for production but production is not ready for my model&quot;</tspan></text>
<text class="t" x="32" y="881"><tspan class="accent">$ </tspan><tspan class="text">deepak --hire</tspan></text>
<rect class="cursor" x="171" y="867" width="9" height="18" rx="1"/>
<path d="M0.5 908 h899 v29.5 a14 14 0 0 1 -14 14 h-871 a14 14 0 0 1 -14 -14 z" fill="#161b22"/>
<line x1="0.5" y1="908" x2="899.5" y2="908" stroke="#30363d"/>
<circle class="live" cx="38" cy="930" r="5"/>
<text class="t" x="52" y="934" style="font-size:13px">deployed in production<tspan class="dim">  ·  accepting new prompts</tspan></text>
</svg>